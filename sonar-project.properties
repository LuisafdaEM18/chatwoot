sonar.projectKey=Chatwoot
sonar.projectName=Chatwoot
sonar.sourceEncoding=UTF-8

# Chatwoot tiene miles de archivos. Según el plan de pruebas (numerales 5.4 y 15), el análisis se
# limita al código de los 15 requisitos del alcance: así las métricas de calidad y la cobertura
# reflejan lo que el equipo probó, y el análisis tarda minutos en lugar de horas.
sonar.sources=app
sonar.inclusions=\
  app/models/conversation.rb,\
  app/models/concerns/labelable.rb,\
  app/models/label.rb,\
  app/models/contact.rb,\
  app/models/note.rb,\
  app/models/data_import.rb,\
  app/models/custom_attribute_definition.rb,\
  app/models/custom_filter.rb,\
  app/models/canned_response.rb,\
  app/models/macro.rb,\
  app/models/automation_rule.rb,\
  app/models/team.rb,\
  app/builders/messages/message_builder.rb,\
  app/services/conversations/assignment_service.rb,\
  app/services/search_service.rb,\
  app/services/data_import/contact_manager.rb,\
  app/services/filter_service.rb,\
  app/services/macros/execution_service.rb,\
  app/services/automation_rules/**/*.rb,\
  app/services/reports/drilldown_timestamp_validator.rb,\
  app/controllers/api/v1/accounts/conversations_controller.rb,\
  app/controllers/api/v1/accounts/conversations/assignments_controller.rb,\
  app/controllers/api/v1/accounts/conversations/messages_controller.rb,\
  app/controllers/api/v1/accounts/conversations/labels_controller.rb,\
  app/controllers/api/v1/accounts/labels_controller.rb,\
  app/controllers/api/v1/accounts/search_controller.rb,\
  app/controllers/api/v1/accounts/contacts_controller.rb,\
  app/controllers/api/v1/accounts/contacts/notes_controller.rb,\
  app/controllers/api/v1/accounts/custom_attribute_definitions_controller.rb,\
  app/controllers/api/v1/accounts/custom_filters_controller.rb,\
  app/controllers/api/v1/accounts/canned_responses_controller.rb,\
  app/controllers/api/v1/accounts/macros_controller.rb,\
  app/controllers/api/v1/accounts/automation_rules_controller.rb,\
  app/controllers/api/v1/accounts/teams_controller.rb,\
  app/controllers/api/v1/accounts/team_members_controller.rb,\
  app/controllers/api/v2/accounts/reports_controller.rb,\
  app/javascript/dashboard/store/modules/conversations/actions.js,\
  app/javascript/dashboard/store/modules/conversationSearch.js,\
  app/javascript/dashboard/store/modules/labels.js,\
  app/javascript/dashboard/store/modules/contacts/actions.js,\
  app/javascript/dashboard/store/modules/contactNotes.js,\
  app/javascript/dashboard/store/modules/attributes.js,\
  app/javascript/dashboard/store/modules/cannedResponse.js,\
  app/javascript/dashboard/store/modules/teams/actions.js,\
  app/javascript/dashboard/helper/filterQueryGenerator.js,\
  app/javascript/dashboard/helper/automationHelper.js,\
  app/javascript/dashboard/routes/dashboard/settings/macros/macroHelper.js,\
  app/javascript/dashboard/routes/dashboard/settings/teams/Create/CreateTeam.vue,\
  app/javascript/dashboard/components/ChatList.vue,\
  app/javascript/dashboard/components/buttons/ResolveAction.vue,\
  app/javascript/dashboard/routes/dashboard/commands/CmdBarConversationSnooze.vue,\
  app/javascript/shared/helpers/ReportsDataHelper.js

# Pruebas del equipo: RSpec (spec/qa), Vitest (app/javascript/qa) y Cypress (qa/cypress).
sonar.tests=spec/qa,app/javascript/qa,qa/cypress
sonar.test.inclusions=spec/qa/**/*_spec.rb,app/javascript/qa/**/*.spec.js,qa/cypress/**/*.cy.js

# Estos tres componentes de pantalla (modificados por el equipo) se siguen analizando por
# calidad, pero no cuentan para la cobertura: no tienen pruebas unitarias en Chatwoot y se
# verifican de punta a punta con Cypress, que no genera cobertura.
sonar.coverage.exclusions=\
  app/javascript/dashboard/components/ChatList.vue,\
  app/javascript/dashboard/components/buttons/ResolveAction.vue,\
  app/javascript/dashboard/routes/dashboard/commands/CmdBarConversationSnooze.vue

# Cobertura que genera el pipeline (Jenkinsfile).
# SonarQube 26 no lee el .resultset.json cuando incluye cobertura de ramas; usa el JSON del
# formateador de SimpleCov (qa/simplecov_qa.rb).
sonar.ruby.coverage.reportPaths=qa/reports/coverage/coverage.json
sonar.javascript.lcov.reportPaths=qa/reports/coverage-front/lcov.info
