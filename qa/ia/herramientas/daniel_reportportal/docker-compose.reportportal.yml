# ReportPortal (criterio 14, tercera herramienta de Daniel) — pila mínima v5.
# ReportPortal recibe los resultados de las pruebas y su módulo de IA (Auto-Analysis,
# basado en un modelo de ML sobre OpenSearch) propone la causa de cada fallo y marca
# los fallos ya conocidos. Aquí se le envían los resultados JUnit de las pruebas de
# contactos de Daniel (Cypress RF-06..10) para analizarlos.
#
# Requiere ~4 GB de RAM libres. En el equipo de pruebas no se ejecutó en vivo a la vez
# que Ollama y Chatwoot; se deja listo para levantar con:
#   cd qa/ia/herramientas/daniel_reportportal
#   docker compose -f docker-compose.reportportal.yml up -d
# UI en http://localhost:8080 (usuario por defecto superadmin / erebus).
#
# Compose adaptado del oficial: https://github.com/reportportal/reportportal
services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: rpuser
      POSTGRES_PASSWORD: rppass
      POSTGRES_DB: reportportal
    volumes: [rp_pg:/var/lib/postgresql/data]

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
    volumes: [rp_os:/usr/share/opensearch/data]

  # api, uat (autorización), index/jobs, analyzer (IA), ui y gateway se añaden desde el
  # compose oficial (son ~8 servicios). Ver README.md: por el tamaño de la pila, aquí se
  # listan solo las dependencias de datos; los servicios de aplicación se toman del
  # compose oficial fijado a la versión 5.

volumes:
  rp_pg:
  rp_os:
