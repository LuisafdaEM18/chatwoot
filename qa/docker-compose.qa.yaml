# Entorno liviano para correr RSpec sin construir la imagen completa de desarrollo.
# Reutiliza los servicios postgres y redis de docker-compose.production.yaml.
#
# Uso (desde la raíz del repositorio):
#   docker compose -f docker-compose.production.yaml -f qa/docker-compose.qa.yaml run --rm rspec bundle install
#   docker compose -f docker-compose.production.yaml -f qa/docker-compose.qa.yaml run --rm rspec bundle exec rails db:create db:schema:load
#   docker compose -f docker-compose.production.yaml -f qa/docker-compose.qa.yaml run --rm rspec bundle exec rspec spec/models/label_spec.rb

services:
  rspec:
    image: ruby:3.4.4
    working_dir: /app
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
      - qa_bundle:/usr/local/bundle
    environment:
      - RAILS_ENV=test
      - NODE_ENV=test
      - EXECJS_RUNTIME=Disabled
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=chatwoot_test
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=
      - BUNDLE_WITHOUT=
      - BUNDLE_JOBS=4
    profiles:
      - qa

volumes:
  qa_bundle:
